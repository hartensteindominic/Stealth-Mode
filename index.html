<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>HyperStream</title>
<style>
:root {
  --bg: #000;
  --card: #1c1c1e;
  --border: #38383a;
  --text: #f5f5f7;
  --muted: #8e8e93;
  --blue: #0a84ff;
  --pink: #ff375f;
  --green: #30d158;
  --orange: #ff9f0a;
  --purple: #bf5af2;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#app { display: flex; flex: 1; overflow: hidden; }
#panel {
  width: 320px;
  background: var(--card);
  border-right: 1px solid var(--border);
  padding: 20px 16px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
  flex-shrink: 0;
}
.logo { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
.sub { font-size: 13px; color: var(--muted); margin-top: -8px; }
.card {
  background: #2c2c2e;
  border-radius: 16px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.3px; }
.row { display: flex; justify-content: space-between; align-items: center; font-size: 15px; }
button {
  border: none;
  border-radius: 14px;
  padding: 13px;
  font-size: 15px;
  font-weight: 600;
  color: #fff;
  width: 100%;
  cursor: pointer;
}
button:disabled { opacity: 0.3; }
.primary { background: linear-gradient(135deg, var(--purple), var(--pink)); }
.green { background: var(--green); color: #000; }
.red { background: var(--pink); }
.blue { background: var(--blue); }
.orange { background: var(--orange); color: #000; }
input[type=range] { accent-color: var(--pink); width: 120px; }
input[type=file] { font-size: 13px; color: var(--muted); width: 100%; }
#stage { flex: 1; position: relative; background: #000; }
canvas { width: 100%; height: 100%; display: block; }
.badge {
  position: absolute;
  top: 16px; right: 16px;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  z-index: 10;
  display: flex; gap: 10px; align-items: center;
}
.rec { display: none; color: #ff453a; font-weight: 600; align-items: center; gap: 6px; }
.rec.on { display: flex; }
.dot { width: 8px; height: 8px; background: #ff453a; border-radius: 50%; animation: p 1s infinite; }
@keyframes p { 50% { opacity: 0.3; } }
video { display: none; }
.status { font-size: 13px; color: var(--blue); min-height: 18px; }
@media (max-width: 768px) {
  #app { flex-direction: column; }
  #panel { width: 100%; max-height: 40vh; border-right: none; border-bottom: 1px solid var(--border); }
}
</style>
</head>
<body>
<div id="app">
  <div id="panel">
    <div>
      <div class="logo">HyperStream</div>
      <div class="sub">Holographic World</div>
    </div>

    <div class="card">
      <div class="label">Live Scan</div>
      <button class="red" id="scanBtn" onclick="toggleScan()">Activate Scan</button>
      <div class="row"><span>Detail</span><input type="range" min="1" max="4" value="2" oninput="stepSize=+this.value"></div>
      <div class="row"><span>Depth</span><input type="range" min="50" max="200" value="120" oninput="depthMul=+this.value"></div>
      <div class="row"><span>Voxels</span><b id="nLive" style="color:var(--pink)">0</b></div>
    </div>

    <div class="card">
      <div class="label">Recording</div>
      <div class="row"><span>Status</span><b id="recStatus" style="color:var(--muted)">Idle</b></div>
      <div class="row"><span>Time</span><b id="recTime">00:00</b></div>
      <div class="row"><span>Frames</span><b id="frameCount" style="color:var(--purple)">0</b></div>
      <button class="green" id="recBtn" onclick="toggleRec()">Start Recording</button>
      <button class="blue" id="playBtn" onclick="togglePlay()" disabled>Play Sequence</button>
      <button class="primary" id="dlVid" onclick="dlVideo()" disabled>Download Video</button>
      <button class="primary" id="dlSeq" onclick="dlSeq()" disabled>Export Sequence</button>
    </div>

    <div class="card">
      <div class="label">Holographic World</div>
      <div class="row"><span>Points</span><b id="envPts" style="color:var(--green)">0</b></div>
      <div class="status" id="status"></div>
      <button class="primary" id="buildSeq" onclick="buildSeq()" disabled>Build from Sequence</button>
      <button class="orange" id="buildVid" onclick="buildVid()" disabled>Build from Video</button>
      <button class="green" id="saveBtn" onclick="saveEnv()" disabled>Save World</button>
      <button class="orange" id="shareBtn" onclick="shareEnv()" disabled>Share Video</button>
      <button class="red" id="clearBtn" onclick="clearEnv()" disabled>
